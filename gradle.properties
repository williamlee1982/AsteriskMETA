#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
android.enableR8.fullMode=true
#AndroidLibClashLite core AAR
# GitHub repository whose releases host libclash.aar (tag = ProjectConfig.ANDROID_LIB_CLASH_LITE_VERSION).
asterisk.libclash.repository=williamlee1982/AndroidLibClashLite
# Optional: absolute path to a locally built libclash.aar; skips download and checksum. Set it in
# ~/.gradle/gradle.properties or with -Pasterisk.libclash.localAar=..., never commit an AAR.
#asterisk.libclash.localAar=
